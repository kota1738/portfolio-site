server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Single-page site: unknown paths get the styled 404, not nginx's default.
    error_page 404 /404.html;

    # Fingerprint-free static assets: revalidate rather than cache hard, so a
    # redeploy is picked up immediately.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript text/plain application/xml image/svg+xml;
    gzip_min_length 512;
}
